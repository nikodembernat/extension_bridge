name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.x

jobs:
  check:
    name: Analyze & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (leancode_lint)
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Unit tests (VM)
        run: flutter test
      - name: Unit tests (Chrome)
        run: flutter test --platform chrome
      - name: Validate package
        run: flutter pub publish --dry-run

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build apk --debug
      - name: Integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: .github/scripts/android_integration_test.sh

  ios:
    name: iOS
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build ios --simulator --debug
      - name: Ensure CocoaPods is not used
        run: test ! -e example/ios/Podfile
      - name: Boot simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"])
                          sys.exit()
          ')
          echo "Booting $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Integration tests
        run: .github/scripts/ios_integration_test.sh ${{ steps.simulator.outputs.udid }}

  macos:
    name: macOS
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build macos --debug
      - name: Ensure CocoaPods is not used
        run: test ! -e example/macos/Podfile
      - name: Integration tests
        working-directory: example
        run: flutter test integration_test -d macos

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build windows --debug
      - name: Integration tests
        working-directory: example
        run: flutter test integration_test -d windows

  linux:
    name: Linux
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build linux --debug
      - name: Integration tests
        working-directory: example
        run: xvfb-run -a flutter test integration_test -d linux

  web:
    name: Web
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build web
      - name: Integration tests
        working-directory: example
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          "${{ steps.chrome.outputs.chromedriver-path }}" --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/extension_bridge_test.dart \
            -d web-server --browser-name=chrome --headless \
            --chrome-binary="${{ steps.chrome.outputs.chrome-path }}"
